<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#08080d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b5e"/>
      <stop offset="100%" stop-color="#160e32"/>
    </linearGradient>
    <linearGradient id="shoulder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#5b10c0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- Left grip -->
  <ellipse cx="18" cy="43" rx="9" ry="8" fill="url(#body)"/>
  <!-- Right grip -->
  <ellipse cx="46" cy="43" rx="9" ry="8" fill="url(#body)"/>
  <!-- Main body -->
  <rect x="9" y="20" width="46" height="25" rx="12" fill="url(#body)"/>

  <!-- Shoulder buttons -->
  <rect x="9"  y="17" width="15" height="6" rx="3" fill="url(#shoulder)" opacity="0.85"/>
  <rect x="40" y="17" width="15" height="6" rx="3" fill="url(#shoulder)" opacity="0.85"/>

  <!-- D-pad cross -->
  <rect x="17.5" y="27" width="5" height="12" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  <rect x="14"   y="30" width="12" height="5" rx="2" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Action buttons (diamond) -->
  <circle cx="41" cy="27" r="3.2" fill="#ff007f"  filter="url(#glow)"/>
  <circle cx="47" cy="33" r="3.2" fill="#8a2be2"  filter="url(#glow)"/>
  <circle cx="35" cy="33" r="3.2" fill="#00f0ff"  filter="url(#glow)"/>
  <circle cx="41" cy="39" r="3.2" fill="#ffd700"  filter="url(#glow)"/>

  <!-- Select / Start -->
  <rect x="25" y="30" width="5" height="3" rx="1.5" fill="#3a3a5c"/>
  <rect x="34" y="30" width="5" height="3" rx="1.5" fill="#3a3a5c"/>
</svg>
